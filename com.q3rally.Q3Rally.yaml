app-id: com.q3rally.Q3Rally
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: q3rally
rename-icon: quake3
rename-desktop-file: q3rally.desktop
finish-args:
  - --socket=pulseaudio
  - --socket=x11
  - --share=ipc
  - --share=network
  - --device=dri
  - --persist=.q3rally

modules:
  - name: q3rally
    buildsystem: simple
    build-commands:
      - |
        pushd engine
        export BUILD_GAME_QVM=0
        make DEFAULT_BASEDIR=${FLATPAK_DEST}/lib/q3rally USE_AUTOUPDATER=0 -j${FLATPAK_BUILDER_N_JOBS}
        mkdir -p ${FLATPAK_DEST}/bin/
        make copyfiles COPYBINDIR=${FLATPAK_DEST}/bin/ COPYDIR=${FLATPAK_DEST}/lib/q3rally/ NO_STRIP=1
      - mv ${FLATPAK_DEST}/bin/q3rally.* ${FLATPAK_DEST}/bin/q3rally
      - mv ${FLATPAK_DEST}/bin/q3rally-server.* ${FLATPAK_DEST}/bin/q3rally-server
      - mv ${FLATPAK_DEST}/bin/*.so ${FLATPAK_DEST}/lib/q3rally/
      - install -Dm0644 engine/misc/quake3.svg -t ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/
      - install -Dm0644 engine/misc/setup/q3rally.desktop -t ${FLATPAK_DEST}/share/applications/
      - install -Dm0644 engine/misc/setup/${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/
    sources:
      - type: archive
        url: https://github.com/Q3Rally-Team/q3rally/archive/refs/tags/v0.8.4.tar.gz
        sha256: bdde2b11f00f2fc262cf86266a641d4f1b1addec1d1fb8bbf214352c20989b83
      - type: patch
        path: fix-appdata.patch
  - name: q3rally-data
    buildsystem: simple
    build-commands:
      - cp -rv baseq3r ${FLATPAK_DEST}/lib/q3rally/
    sources:
      - type: archive
        url: https://github.com/Q3Rally-Team/q3rally/releases/download/v0.8.4/Q3Rally-v0.8.4-linux-x86_64.zip
        sha256: 16ada55675fd8b297ef32ab02f18811ab520b82d709e54b0e588234673dd1015
